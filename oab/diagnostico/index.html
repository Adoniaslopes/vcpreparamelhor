<style>
:root{--noite:#04091A;--noite2:#0A1430;--card:#0F1D38;--linha:rgba(157,176,211,.18);--luz:#EEF2FA;--nevoa:#A9B7D0;--ouro:#F5C542;--folha:#3DDC97;--brasa:#FF4D5E;--vinho:#A3172B;--azul:#13284A}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#04091A}
body{background:radial-gradient(70% 40% at 80% 0%,rgba(245,197,66,.08),transparent 70%),linear-gradient(180deg,var(--noite2),var(--noite) 60%);background-attachment:fixed;color:var(--luz);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:17px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--ouro)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1080px;margin:0 auto;padding:18px 20px;font-size:14px;color:var(--nevoa)}
.top b{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);font-size:15px}
.top a{color:var(--nevoa)}
.wrap{max-width:1080px;margin:0 auto;padding:10px 20px 80px}
h1,h2{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.01em;line-height:1.1}
h1{font-size:clamp(34px,5vw,54px);margin-bottom:18px}
h1 em,h2 em{color:var(--ouro);font-style:italic}
h2{font-size:clamp(26px,3.4vw,34px);margin-bottom:12px}
p+p{margin-top:12px}
.sub{color:var(--nevoa)}
.chip{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro);background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.45);padding:6px 12px;border-radius:8px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 17px 'IBM Plex Sans',sans-serif;padding:15px 26px;border-radius:999px;border:1px solid var(--linha);background:rgba(255,255,255,.04);color:var(--luz);cursor:pointer;text-decoration:none;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--ouro);color:#1A1404;border:0;box-shadow:0 14px 34px rgba(245,197,66,.28)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn:focus-visible,input:focus-visible,.alt:focus-visible{outline:3px solid #3EC5FF;outline-offset:2px}
/* cadastro */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start;margin-top:20px}
.lista{list-style:none;margin:22px 0}
.lista li{padding:10px 0 10px 32px;position:relative;border-top:1px solid var(--linha);color:#D7DDEA}
.lista li:before{content:'✓';position:absolute;left:4px;color:var(--folha);font-weight:700}
form label{display:block;font-size:14.5px;color:var(--nevoa);margin-top:14px}
form input[type=text],form input[type=email],form input[type=tel],form input[type=password]{display:block;width:100%;margin-top:6px;font:500 17px 'IBM Plex Sans',sans-serif;color:var(--luz);background:#081226;border:1px solid #34507F;border-radius:12px;padding:12px 14px}
.aceite{display:flex!important;gap:10px;align-items:flex-start;font-size:14px!important;line-height:1.45}
.aceite input{margin-top:3px;width:18px;height:18px;flex:none}
form .btn{width:100%;margin-top:20px}
.msg{min-height:1.4em;margin-top:12px;font-size:14.5px}
.msg.bad{color:#FF8A95}.msg.ok{color:var(--folha)}
.troca{margin-top:16px;font-size:14.5px;text-align:center;color:var(--nevoa)}
.mini{font-size:13px;color:#7685A3;margin-top:12px}
/* questão */
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ouro),var(--folha));transition:width .3s}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--linha);margin-bottom:14px}
.enun{font-family:'Newsreader',serif;font-size:21px;line-height:1.5;white-space:pre-line}
.alts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.alt{display:flex;gap:14px;align-items:flex-start;text-align:left;font:16.5px/1.5 'IBM Plex Sans',sans-serif;color:var(--luz);background:rgba(255,255,255,.03);border:1.5px solid var(--linha);border-radius:14px;padding:14px 16px;cursor:pointer}
.alt:hover:not(:disabled){border-color:rgba(245,197,66,.6)}
.alt .lt{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:1.5px solid var(--nevoa);font-size:14px}
.alt.cert{border-color:var(--folha);background:rgba(61,220,151,.1)}.alt.cert .lt{background:var(--folha);border-color:var(--folha);color:#062216}
.alt.errd{border-color:var(--brasa);background:rgba(255,77,94,.08)}.alt.errd .lt{background:var(--brasa);border-color:var(--brasa);color:#fff}
.alt:disabled{cursor:default}
.ret{margin-top:18px;padding:16px 18px;border-radius:14px;font-size:15.5px}
.ret b{display:block;font-size:17px;margin-bottom:4px}
.ret.ok{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.45)}
.ret.er{background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.4)}
.ret.ns{background:rgba(62,197,255,.08);border:1px solid rgba(62,197,255,.4)}
.ret .x{margin-top:8px;color:#D7DDEA}
.barra{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.cartao{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px}
.cartao button{font:600 12px 'IBM Plex Sans',sans-serif;aspect-ratio:1;border-radius:7px;border:1px solid var(--linha);background:rgba(255,255,255,.03);color:var(--nevoa);cursor:pointer;padding:0}
.cartao .ok{background:rgba(61,220,151,.25);border-color:var(--folha);color:#fff}
.cartao .er{background:rgba(255,77,94,.2);border-color:var(--brasa);color:#fff}
.cartao .ns{background:rgba(62,197,255,.15);border-color:#3EC5FF;color:#fff}
.cartao .atual{outline:2px solid var(--ouro);outline-offset:1px}
.placar{display:flex;justify-content:space-between;align-items:baseline}
.placar b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;line-height:1;color:var(--folha)}
/* resultado */
.nota{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.medidor{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;text-align:center}
.medidor div{width:166px;height:166px;border-radius:50%;background:var(--noite2);display:grid;place-items:center}
.medidor b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:72px;line-height:.9}
.medidor span{font-size:14px;color:var(--nevoa)}
.discs{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;margin-top:10px}
.dl{display:grid;grid-template-columns:140px 1fr 46px;gap:10px;align-items:center;font-size:14.5px;padding:4px 0}
.dl .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.dl .bar i{display:block;height:100%;border-radius:6px}
.dl .v{text-align:right;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.pill{display:inline-block;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;margin:4px 6px 0 0;background:rgba(255,255,255,.06);border:1px solid var(--linha)}
.cta{margin-top:26px;padding:30px;border-radius:26px;border:2.5px solid var(--ouro);background:linear-gradient(160deg,rgba(245,197,66,.14),rgba(245,197,66,.02) 60%),var(--card)}
.cta .preco{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--ouro)}
/* ganchos para a plataforma */
.bloco{display:inline-block;margin:0 0 14px 8px;font-size:13px;color:var(--nevoa)}
.rumo{margin-top:12px}
.rumo .trilho{position:relative;height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.rumo .trilho i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--ouro),var(--folha));transition:width .4s}
.rumo small{display:block;margin-top:6px;font-size:13.5px;color:var(--nevoa)}
.tranca{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:14px;border:1.5px dashed rgba(245,197,66,.55);background:rgba(245,197,66,.05);font-size:14.5px;line-height:1.5;color:#D7DDEA}
.tranca svg{flex:none;width:22px;height:22px;margin-top:1px}
.tranca b{color:var(--ouro);font-weight:600}
.tranca a{font-weight:600}
.parcial{margin-top:14px;padding:16px 18px;border-radius:14px;background:rgba(62,197,255,.07);border:1px solid rgba(62,197,255,.35);font-size:15px}
.parcial b{color:#fff}
.festa{margin-top:14px;padding:18px;border-radius:14px;background:linear-gradient(135deg,rgba(61,220,151,.18),rgba(245,197,66,.12));border:1.5px solid var(--folha);font-size:15.5px}
.festa b{display:block;font-size:19px;color:#fff;margin-bottom:4px}
.vitrine{margin-top:16px}
.vitrine h3{font:700 15px 'IBM Plex Sans',sans-serif;color:var(--ouro);margin-bottom:6px}
.vitrine li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--linha);font-size:14px;color:#C9D3E5}
.vitrine li svg{flex:none;width:16px;height:16px}
.vitrine a{display:block;margin-top:10px;font-size:14px;font-weight:600}
.plano{position:relative;margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--linha)}
.plano table{width:100%;border-collapse:collapse;font-size:14.5px}
.plano td,.plano th{padding:11px 14px;border-top:1px solid var(--linha);text-align:left}
.plano th{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.12em;font-size:13px;color:var(--nevoa);text-transform:uppercase;border-top:0;background:rgba(255,255,255,.03)}
.plano .borra td{filter:blur(4px);user-select:none}
.plano .veu{position:absolute;left:0;right:0;bottom:0;height:62%;display:grid;place-items:center;background:linear-gradient(180deg,transparent,rgba(10,20,48,.92) 45%);text-align:center;padding:16px}
.plano .veu b{display:block;color:#fff;font-size:17px;margin-bottom:8px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.nums div{padding:16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--linha)}
.nums b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:40px;line-height:1;color:var(--ouro)}
.nums span{display:block;font-size:14px;color:var(--nevoa);margin-top:6px;line-height:1.4}
@media (max-width:860px){.nums{grid-template-columns:1fr}}
.oculto{display:none!important}
.carregando{text-align:center;padding:80px 20px;color:var(--nevoa)}
@media (max-width:860px){.hero,.qgrid,.nota{grid-template-columns:1fr}.discs,.g3{grid-template-columns:1fr}.medidor{margin:0 auto}.qgrid aside{order:-1}.cartao{grid-template-columns:repeat(10,1fr)}}
@media (max-width:480px){.card{padding:20px}.enun{font-size:19px}.dl{grid-template-columns:110px 1fr 40px}}
.intro .lead{font-size:clamp(18px,2vw,21px);color:var(--luz);margin-top:14px}
.intro .lead b{color:var(--ouro)}
.intro h2.it{font-size:clamp(22px,2.6vw,27px);margin:30px 0 10px;color:var(--luz)}
.intro p{color:#C9D3E5;margin-top:10px}.intro p b{color:#fff}
.bus{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 6px}
.bus div{padding:18px 16px;border-radius:16px;background:rgba(245,197,66,.07);border:1px solid rgba(245,197,66,.45)}
.bus b{display:block;color:var(--ouro);font-size:17px;margin-bottom:6px}
.bus span{display:block;color:#D7DDEA;font-size:15px;line-height:1.45}
.intro .sonho{margin-top:18px;font-size:18px;color:var(--luz)}.intro .sonho em{color:var(--ouro)}
.intro .lista{margin-bottom:24px}
.intro #comecar{width:100%;font-size:19px}
@media (max-width:700px){.bus{grid-template-columns:1fr}}
</style>

  }

  // ---------- início ----------
  if (!cfg.url || !cfg.anonKey || !window.supabase) { tela.innerHTML = '<div class="carregando">Diagnóstico indisponível no momento.</div>'; return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'oab-diag-sessao'}});
  sb.auth.getSession().then(function (s) { if (s.data.session) entrar(s.data.session); else telaCadastro(/[?&]entrar/.test(location.search) ? 'login' : 'cad'); });
  sb.auth.onAuthStateChange(function (ev, s) { if (ev === 'SIGNED_IN' && s && !user) entrar(s); });
})();
</script>
