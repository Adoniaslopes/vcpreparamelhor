<body>
<!-- Acesso (só aparece quando config.js tem as chaves do Supabase) -->
<div id="acesso" hidden>
  <div class="ac-wrap">
    <div class="ac-card">
      <div class="marca"><span class="bolha cheia"></span><span class="bolha"></span> Método Aprovação OAB</div>
      <section data-ac="login">
        <h1>Entrar</h1>
        <form id="f-login">
          <label>E-mail<input type="email" id="l-email" required autocomplete="email"></label>
          <label>Senha<input type="password" id="l-senha" required autocomplete="current-password"></label>
          <button class="btn pri" type="submit">Entrar</button>
          <p class="msg" id="l-msg" role="status"></p>
        </form>
        <p class="ac-links"><a href="#" data-ac-ir="cad">Criar cadastro</a><a href="#" data-ac-ir="rec">Esqueci minha senha</a></p>
      </section>
      <section data-ac="cad" hidden>
        <h1>Criar cadastro</h1>
        <form id="f-cad">
          <label>Nome completo<input id="c-nome" required autocomplete="name"></label>
          <label>E-mail<input type="email" id="c-email" required autocomplete="email"></label>
          <label>Senha (mínimo 8 caracteres)<input type="password" id="c-senha" required minlength="8" autocomplete="new-password"></label>
          <button class="btn pri" type="submit">Criar cadastro</button>
          <p class="msg" id="c-msg" role="status"></p>
        </form>
        <p class="ac-links"><a href="#" data-ac-ir="login">Já tenho cadastro</a></p>
      </section>
      <section data-ac="rec" hidden>
        <h1>Recuperar senha</h1>
        <form id="f-rec">
          <label>E-mail<input type="email" id="r-email" required></label>
          <button class="btn pri" type="submit">Enviar link</button>
          <p class="msg" id="r-msg" role="status"></p>
        </form>
        <p class="ac-links"><a href="#" data-ac-ir="login">Voltar</a></p>
      </section>
      <section data-ac="nova" hidden>
        <h1>Nova senha</h1>
        <form id="f-nova">
          <label>Nova senha<input type="password" id="n-senha" required minlength="8" autocomplete="new-password"></label>
          <button class="btn pri" type="submit">Salvar senha</button>
          <p class="msg" id="n-msg" role="status"></p>
        </form>
      </section>
      <section data-ac="espera" hidden>
        <h1 id="e-tit">Cadastro recebido</h1>
        <p id="e-txt"></p>
        <button class="btn" data-sair>Sair</button>
      </section>
    </div>
  </div>
</div>
